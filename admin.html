<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d12" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=2.5.0" />
  <link rel="stylesheet" href="/admin.css?v=2.5.0" />
  <title>ToolCart Admin</title>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div>
  <div id="toastHost" class="toast-host"></div>

  <main id="adminLogin" class="admin-login hidden">
    <section class="admin-login-card panel-enter">
      <div class="auth-mark"><img src="/toolcart-logo.png" alt="" /></div>
      <span class="eyebrow">TOOLCART CONTROL</span><h1>Administrator</h1><p>Secure access to ecosystem operations.</p>
      <form id="adminLoginForm" class="form-grid">
        <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary">Sign in</button>
      </form>
      <button type="button" id="showAdminSetup" class="admin-setup-link">First-time administrator setup</button>
      <form id="adminSetupForm" class="form-grid admin-first-setup hidden">
        <div class="admin-setup-note"><strong>Create the owner account once.</strong><span>Enter the temporary ADMIN_BOOTSTRAP_TOKEN you add in Cloudflare. After setup succeeds, remove that secret.</span></div>
        <div class="field"><label>Bootstrap token</label><input name="bootstrapToken" type="password" autocomplete="off" required></div>
        <div class="field"><label>Full name</label><input name="fullName" autocomplete="name" required></div>
        <div class="field"><label>Admin email</label><input name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label>Admin password</label><input name="password" type="password" minlength="12" autocomplete="new-password" required></div>
        <div id="adminSetupStatus" class="admin-setup-status hidden" role="status" aria-live="polite"></div>
        <button class="btn btn-primary" type="submit">Create owner administrator</button>
        <button type="button" id="cancelAdminSetup" class="btn btn-ghost">Back to sign in</button>
      </form>
      <a class="admin-back" href="/">Back to ToolCart</a>
    </section>
  </main>

  <main id="adminShell" class="admin-shell hidden">
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-brand"><img src="/toolcart-logo.png" alt=""><div><strong>ToolCart</strong><span>Administrator</span></div></div>
      <nav id="adminNav">
        <button class="active" data-admin-tab="dashboard"><span>◫</span>Dashboard</button>
        <button data-admin-tab="customers"><span>◎</span>Customers</button>
        <button data-admin-tab="apps"><span>◆</span>Tools & Products</button>
        <button data-admin-tab="subscriptions"><span>◇</span>Subscriptions</button>
        <button data-admin-tab="payments"><span>◌</span>Payments</button>
        <button data-admin-tab="updates"><span>↗</span>Updates</button>
        <button data-admin-tab="requests"><span>⌁</span>Requests</button>
        <button data-admin-tab="notifications"><span>•</span>Notifications</button>
        <button data-admin-tab="analytics"><span>⌁</span>Analytics</button>
        <button data-admin-tab="appearance"><span>◐</span>Appearance</button>
        <button data-admin-tab="settings"><span>⚙</span>Settings</button>
        <button data-admin-tab="audit"><span>≡</span>Audit Log</button>
        <button data-admin-tab="diagnostics"><span>⌘</span>Diagnostics</button>
      </nav>
      <div class="admin-sidebar-foot"><div id="adminIdentity"></div><button id="adminLogout" class="micro-btn">Sign out</button></div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button id="adminMenuBtn" class="icon-btn">☰</button>
        <div><span class="eyebrow">TOOLCART ADMIN</span><h1 id="adminPageTitle">Dashboard</h1></div>
        <button id="adminRefresh" class="icon-btn">↻</button>
      </header>
      <section id="adminContent" class="admin-content"></section>
    </div>

    <nav id="adminMobileDock" class="admin-mobile-dock">
      <button class="active" data-admin-tab="dashboard"><span>◫</span><em>Home</em></button>
      <button data-admin-tab="customers"><span>◎</span><em>Users</em></button>
      <button data-admin-tab="apps"><span>◆</span><em>Tools</em></button>
      <button data-admin-tab="requests"><span>⌁</span><em>Requests</em></button>
      <button id="adminMore"><span>•••</span><em>More</em></button>
    </nav>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <section id="adminModal" class="modal detail-sheet hidden"><button class="modal-close" data-close-admin-modal>×</button><div id="adminModalContent"></div></section>
  <script type="module" src="/admin.js?v=2.5.0"></script>
</body>
</html>

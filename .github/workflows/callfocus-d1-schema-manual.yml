
name: CallFocus D1 schema setup (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-schema:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out CallFocus repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate intended target and schema file
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_D1_MIGRATION_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          test -f wrangler.jsonc || { echo 'Missing wrangler.jsonc'; exit 1; }
          test -s 0001_wallet_schema.sql || { echo 'Missing root 0001_wallet_schema.sql'; exit 1; }
          grep -Fq '754c82ce-2dc1-4db8-b92b-18d1e349dc49' wrangler.jsonc || { echo 'D1 database UUID does not match the approved target; stopping'; exit 1; }
          grep -Fq 'CREATE TABLE IF NOT EXISTS wallet_accounts' 0001_wallet_schema.sql || { echo 'Unexpected schema file; stopping'; exit 1; }

      - name: Prepare SQL execution copy without foreign_keys PRAGMA
        shell: bash
        run: |
          sed '/^[[:space:]]*PRAGMA[[:space:]]\+foreign_keys[[:space:]]*=[[:space:]]*ON[[:space:]]*;[[:space:]]*$/Id' 0001_wallet_schema.sql > /tmp/0001_wallet_schema.sql

      - name: Create empty tables in remote callfocus-wallet D1
        shell: bash
        run: npx --yes wrangler@4 d1 execute callfocus-wallet --remote --file=/tmp/0001_wallet_schema.sql --yes

      - name: Read-only verification of created tables
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute callfocus-wallet --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('wallet_accounts','wallet_journal','pocketfi_account_mappings','pocketfi_funding_intents','pocketfi_webhook_inbox','wallet_migration_audit') ORDER BY name;"
